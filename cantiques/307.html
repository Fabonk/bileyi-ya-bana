<p class="strophe" id="c1"><span class="sn">1</span>Jésus mon Sauveur, arrête<br>
Tes pas à ma voix.<br>
En bénissant d’autres, Maître,<br>
Ne m’oublie pas.</p>
<p class="strophe" id="c2"><span class="sn">2</span>Jésus, Jésus, écoute ma voix!<br>
En bénissant d’autres, Maître<br>
Ne m’oublie pas !</p>
