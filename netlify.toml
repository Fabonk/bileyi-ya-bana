# Page de téléchargement de BILEYI YA BANA (voir LISEZ-MOI.md)
[build]
  publish = "public"

# the installers are downloaded, never shown in the browser
[[headers]]
  for = "/fichiers/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
